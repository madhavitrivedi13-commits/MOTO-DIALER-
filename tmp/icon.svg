  <circle cx="256" cy="256" r="195" fill="none" stroke="#187488" stroke-width="22" opacity="0.65"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#105F70" stroke-width="18" opacity="0.5"/>

  <!-- Specular top-left light sheen -->
  <path d="M 90,170 C 120,95 200,60 290,60 C 360,60 420,90 460,140" fill="none" stroke="#BBE0E8" stroke-width="8" opacity="0.25"/>

