<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="oceanTeal" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0F6478"/>
      <stop offset="45%" stop-color="#167D94"/>
      <stop offset="75%" stop-color="#0F5B6D"/>
      <stop offset="100%" stop-color="#083844"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="12" flood-color="#042028" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Liquid Background -->
  <rect width="512" height="512" fill="url(#oceanTeal)"/>

  <!-- Concentric Water Ripples -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#2697AF" stroke-width="16" opacity="0.85"/>
