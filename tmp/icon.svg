            L 65.0,57.0
            C 62.5,55.0 59.0,55.3 57.0,57.5
            L 54.0,61.0
            C 53.0,62.0 51.5,62.5 50.0,61.5
            C 46.0,59.0 41.0,53.0 38.5,48.0
            C 37.5,46.0 38.0,44.5 39.0,43.5
            L 42.5,40.5
            C 44.7,38.5 45.0,35.0 43.0,32.5
